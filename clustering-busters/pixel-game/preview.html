<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ringfall: preview</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1b1b1f; font-family: system-ui, sans-serif; color: #ddd; }
    main { width: min(960px, 96vw); }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; letter-spacing: .02em; }
    .frame { aspect-ratio: 16 / 9; width: 100%; border: 0; background: #111; display: block; border-radius: 6px; }
    p { font-size: 13px; color: #888; margin: 10px 0 0; }
    code { color: #bbb; }
  </style>
</head>
<body>
  <main>
    <h1>Ringfall (local preview)</h1>
    <!-- Same embed shape as itch.io: the game runs in an iframe at 16:9. -->
    <iframe class="frame" src="./index.html" allow="fullscreen" title="Pixel Game"></iframe>
    <p>WASD move · Space or click attack · Q / 1-4 weapon · E shop (fisherman every 30 s) · F fullscreen. Changes reload automatically.</p>
  </main>
</body>
</html>
